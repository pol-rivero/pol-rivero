<svg fill="none" viewBox="0 0 880 132" width="880" height="132" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
  <div xmlns="http://www.w3.org/1999/xhtml">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; list-style: none; }
      .body {
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-3: #56d364;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        padding: 12px 16px;
        animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .project { display: flex; align-items: flex-start; gap: 18px; }
      .icon { width: 52px; height: 52px; flex-shrink: 0; object-fit: contain; margin-top: 2px; }
      .content { flex: 1; min-width: 0; }
      h2 { font-size: 22px; font-weight: 700; color: var(--text); }
      .name { font-weight: 700; font-size: 16px; color: var(--accent); }
      .desc { color: var(--muted); margin-top: 2px; }
      em { color: var(--text); font-style: italic; }
      .subrow { padding-left: 70px; }
      .sub { padding-left: 4px; }
      .sub li { color: var(--muted); padding-left: 16px; position: relative; }
      .sub li::before {
        content: ""; position: absolute; left: 2px; top: 11px;
        width: 5px; height: 5px; border-radius: 50%; background: var(--accent-3);
      }
      .sub a { color: var(--accent); font-weight: 500; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-color-scheme: light) {
        .body { --text: #1f2328; --muted: #59636e; --accent: #0969da; --accent-3: #1a7f37; }
      }
      @media (prefers-reduced-motion) { .body { animation: none; } }
    </style>
    <div class="body project">
      <img class="icon" src="data:image/png;base64," alt=""/>
      <div class="content">
        <span class="name">CESC</span>
        <div class="desc">Previous CPU architecture, inspired by Ben Eater's SAP-1 and built on breadboards. It's an 8-bit architecture with a very simple instruction set.</div>
        <ul class="sub"><li>Main repository with documentation, images and some tools.</li></ul>
      </div>
    </div>
  </div>
  </foreignObject>
</svg>
