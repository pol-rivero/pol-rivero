<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" fill="none" viewBox="0 0 880 148"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;padding:0;box-sizing:border-box;text-decoration:none;list-style:none}.body{--text:#f0f6fc;--muted:#dce0e3;--accent:#58a6ff;--accent-3:#56d364;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;padding:12px 16px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.project{display:flex;align-items:flex-start;gap:18px}.icon{width:52px;height:52px;flex-shrink:0;object-fit:contain;margin-top:2px}.content{flex:1;min-width:0}.name{font-weight:700;font-size:16px;color:var(--accent)}.desc{color:var(--muted);margin-top:2px}@media (prefers-color-scheme:light){.body{--text:#1f2328;--muted:#3d3e40;--accent:#0969da;--accent-3:#1a7f37}}@media (prefers-reduced-motion){.body{animation:none}}</style><div class="body project"><img class="icon" src="data:image/webp;base64,"/><div class="content"><span class="name">Desktop Plus</span><div class="desc">A GitHub Desktop fork that adds some features I needed for my workflow. It includes commit search, Bitbucket/GitLab support, multiple stashes per branch, and many small features and improvements. Additionally, I keep it up to date with the latest upstream releases, since the shiftkey fork is no longer maintained.</div></div></div></div></foreignObject></svg>