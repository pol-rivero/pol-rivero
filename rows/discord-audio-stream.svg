<svg viewBox="0 0 880 124" width="880" height="124" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
  <div xmlns="http://www.w3.org/1999/xhtml" style="height: 100%">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; list-style: none; }
      .body {
        --text: #f0f6fc;
        --muted: #dce0e3;
        --accent: #58a6ff;
        --accent-3: #56d364;
        --shimmer: #8fc0ff;
        background: #0d1117;
        border-radius: 8px;
        min-height: 100%;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        padding: 12px 16px;
        animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .project { display: flex; align-items: flex-start; gap: 18px; }
      .icon {
        width: 52px; height: 52px; flex-shrink: 0; object-fit: contain; margin-top: 2px;
        animation: iconSettle 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
      }
      .content { flex: 1; min-width: 0; }
      h2 { font-size: 22px; font-weight: 700; color: var(--text); }
      .name {
        font-weight: 700; font-size: 16px; color: var(--accent);
        background: linear-gradient(100deg, var(--accent) 30%, var(--shimmer) 50%, var(--accent) 70%);
        background-size: 250% 100%;
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 12s ease-in-out 1.2s infinite;
      }
      .desc { color: var(--muted); margin-top: 2px; }
      em { color: var(--text); font-style: italic; }
      .subrow { padding-left: 70px; }
      .sub { padding-left: 4px; }
      .sub li { color: var(--muted); padding-left: 16px; position: relative; }
      .sub li::before {
        content: ""; position: absolute; left: 2px; top: 11px;
        width: 5px; height: 5px; border-radius: 50%; background: var(--accent-3);
      }
      .sub a { color: var(--accent); font-weight: 500; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes iconSettle { from { transform: scale(0.92); } to { transform: scale(1); } }
      @keyframes shimmer { 0% { background-position: 150% 0; } 15%, 100% { background-position: -50% 0; } }
      @media (prefers-color-scheme: light) {
        .body { --text: #1f2328; --muted: #3d3e40; --accent: #0969da; --accent-3: #1a7f37; --shimmer: #4d93e6; background: #ffffff; }
      }
      @media (prefers-reduced-motion) {
        .body, .icon, .name { animation: none; }
        .name { background: none; -webkit-text-fill-color: var(--accent); }
      }
    </style>
    <div class="body project">
      <img class="icon" src="data:image/svg+xml;base64," alt=""/>
      <div class="content">
        <span class="name">Discord Audio Stream</span>
        <div class="desc">It's very easy to share your screen using Discord. Being able to hear it, not so much. This tool gives you control over the audio that you send to Discord, making it possible to share a screen with audio, use OBS, and any other use case you can think of.</div>
      </div>
    </div>
  </div>
  </foreignObject>
</svg>
