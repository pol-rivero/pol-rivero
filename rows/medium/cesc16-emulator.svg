<svg xmlns="http://www.w3.org/2000/svg" width="760" height="24" fill="none" viewBox="0 0 760 24"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;padding:0;box-sizing:border-box;text-decoration:none;list-style:none}.body{--text:#f0f6fc;--muted:#dce0e3;--accent:#58a6ff;--accent-3:#56d364;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;padding:12px 16px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.subrow{padding-left:66px}.sub{padding-left:4px}.sub li{color:var(--muted);padding-left:16px;position:relative}.sub li::before{content:&quot;&quot;;position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent-3)}@media (prefers-color-scheme:light){.body{--text:#1f2328;--muted:#3d3e40;--accent:#0969da;--accent-3:#1a7f37}}@media (prefers-reduced-motion){.body{animation:none}}</style><div class="body" style="padding:0 16px 2px"><div class="subrow" style="margin-top:-2px"><ul class="sub"><li>Emulator written in C++, using the ncurses library.</li></ul></div></div></div></foreignObject></svg>