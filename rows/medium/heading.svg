<svg xmlns="http://www.w3.org/2000/svg" width="760" height="60" fill="none" viewBox="0 0 760 60"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;padding:0;box-sizing:border-box;text-decoration:none;list-style:none}.body,h2{color:var(--text)}.body{--text:#f0f6fc;--muted:#dce0e3;--accent:#58a6ff;--accent-3:#56d364;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;padding:12px 16px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}h2{font-size:22px;font-weight:700}@media (prefers-color-scheme:light){.body{--text:#1f2328;--muted:#3d3e40;--accent:#0969da;--accent-3:#1a7f37}}@media (prefers-reduced-motion){.body{animation:none}}</style><div class="body"><h2>Some of my projects</h2></div></div></foreignObject></svg>